[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oueme-ogun-recharge"
version = "0.3.0"
description = "Satellite water balance and groundwater recharge analysis for the Upper Ouémé (Benin) and Upper Ogun (Nigeria) basement catchments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Oloyede" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
